name: studio-ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: xandria-studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade npm (macOS runner npm crash workaround)
        run: npm install -g npm@11

      - name: Install
        run: |
          npm install --no-audit --no-fund || npm install --no-audit --no-fund
          node -e "require.resolve('typescript'); require.resolve('vite'); require.resolve('rollup')"

      - name: Rollup win32 binary (npm/cli#4828 workaround)
        if: runner.os == 'Windows'
        run: npm install --no-save --no-audit --no-fund @rollup/rollup-win32-x64-msvc

      - name: Rollup darwin binary (npm/cli#4828 workaround)
        if: runner.os == 'macOS'
        run: npm install --no-save --no-audit --no-fund @rollup/rollup-darwin-arm64 || npm install --no-save --no-audit --no-fund @rollup/rollup-darwin-x64

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build (player + studio bundles)
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'

      - name: E2E playability tests
        if: runner.os == 'Linux'
        run: xvfb-run -a npx playwright test

      - name: Upload e2e screenshots
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots-${{ matrix.os }}
          path: xandria-studio/tests/e2e/shots/
          retention-days: 7

  desktop-installers:
    name: Desktop app (${{ matrix.os }})
    needs: build-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: xandria-studio-win
          - os: macos-latest
            artifact: xandria-studio-mac
          - os: ubuntu-latest
            artifact: xandria-studio-linux
    defaults:
      run:
        working-directory: xandria-studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade npm (macOS runner npm crash workaround)
        run: npm install -g npm@11

      - name: Install
        run: |
          npm install --no-audit --no-fund || npm install --no-audit --no-fund
          node -e "require.resolve('typescript'); require.resolve('vite'); require.resolve('rollup')"

      - name: Rollup win32 binary (npm/cli#4828 workaround)
        if: runner.os == 'Windows'
        run: npm install --no-save --no-audit --no-fund @rollup/rollup-win32-x64-msvc

      - name: Rollup darwin binary (npm/cli#4828 workaround)
        if: runner.os == 'macOS'
        run: npm install --no-save --no-audit --no-fund @rollup/rollup-darwin-arm64 || npm install --no-save --no-audit --no-fund @rollup/rollup-darwin-x64

      - name: dmg-license module (macOS optional-dep workaround)
        if: runner.os == 'macOS'
        run: |
          npm cache clean --force
          npm install --no-save --no-audit --no-fund --registry=https://registry.npmjs.org dmg-license

      - name: Build web bundles
        run: npm run build

      - name: Package desktop app
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            xandria-studio/release/*.exe
            xandria-studio/release/*.dmg
            xandria-studio/release/*.AppImage
            xandria-studio/release/*.blockmap
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop-installers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
