id: MET-XANDRIA-003
kind: metric
name: "GMECP (Generative Model Evaluation Consistency Protocol) Pass Rate"
underlying_objective: "Consistent, reproducible quality of generated game assets across evaluators"
counter_metrics:
  - name: "Evaluator Drift"
    why_counter: "Evaluators may change standards over time or fatigue"
    measurement_method: "Inter-rater reliability (Cohen's kappa) tracked longitudinally"
  - name: "False Positive Acceptance"
    why_counter: "Easy-to-generate but low-utility assets may pass"
    measurement_method: "Adversarial asset injection: deliberately bad assets tested against protocol"
  - name: "Creative Constraint Violation"
    why_counter: "Passing assets may violate unstated design constraints"
    measurement_method: "Designer review of borderline passes"
gaming_paths:
  - "Optimizing for evaluator-known preferences rather than game quality"
  - "Generating assets that exploit benchmark weaknesses (e.g., high texture detail masking poor topology)"
  - "Overfitting to historical evaluator decisions"
  - "Collusion between generation pipeline and evaluation criteria"
off_dashboard_audit:
  method: "Blind playtest with external users measuring engagement and comprehension"
  cadence: "monthly"
  independent: true
  human_review: required
  delayed_outcome_check: required
expiry:
  review_after_days: 30
  randomization: true
  retirement_condition: "When automated gameplay quality metrics correlate with human judgment at r > 0.8"
reflexivity_risk: "Publishing GMECP scores may cause generation pipeline to optimize for evaluators rather than players, degrading actual game quality"
status_vector:
  semantic: 4
  implementation: 4
  operational: 1
